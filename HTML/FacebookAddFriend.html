<!DOCTYPE html>

    <title>Facebook Add to friend</title>
    <link rel="stylesheet" href="../STYLES/FacebookAddFriend.css">
</head>
<body>
    <div class="the-grid">

         <div class="container">

            <button>Add Friend</button>
        </div>
