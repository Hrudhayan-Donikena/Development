<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise-Buttons</title>
    <link rel="stylesheet" href="../STYLES/cssBasicsButtonsExercise.css">
</head>
<body>
    <section>
        <h3>Uber</h3>
        <button class="uber-button">Request Now</button>
    </section>
    <section>
        <h3>Amazon</h3>
        <button class="amazon-button">Add to Cart</button>
    </section>
    <section>
        <h3>GitHub</h3>
        <button class="github-button">Sign up</button>
    </section>
    <section>
        <h3>Bootstrap</h3>
        <button class="bs-button1">Get started</button>
        <button class="bs-button2">Download</button>
    </section>
    <section>
        <h3>LinkedIn</h3>
        <button class="li-button1">Apply on company website</button>
        <button class="li-button2">Save</button>
    </section>
</body>
</html>
