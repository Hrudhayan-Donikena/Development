<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        button{
            height: 100px;
            width: 100px;
            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 50px;
        }
        .img-1{
            height: 20px;
        }
        .one{
            position: absolute;

           right: -40px;

        }

        .conta{
           width: 100px;
           height: 100px;
           border: 1px solid black;

           position: relative;

           display: flex;
           justify-content: center;
           align-items: center;
        }
        .img-2{
            height: 20px;
        }
        .two{
            position: absolute;

            bottom: -20px;
        }
    </style>
</head>
<body>
    <button>
        <img class="img-1" src="../YouTube/Header/search.svg" alt="">
        <div class="one">search</div>
    </button>

    <div class="conta"> 
        <img class="img-2" src="../YouTube/Header/search.svg" alt="">
        <div class="two">Search</div>
    </div>
</body>
</html>
